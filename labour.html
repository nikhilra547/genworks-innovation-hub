<section class="dream-hub-section">
  <div class="hub-header">
    <h2>🌟 Innovation & Dream Hub</h2>
    <p>Explore ideas across different trades, view community projects, and submit your own dream blueprint.</p>
  </div>

  <!-- Search & Category Filters -->
  <div class="hub-controls">
    <input type="text" id="dreamSearch" placeholder="🔍 Search projects, skills, or tools..." />
    
    <div class="filter-pills" id="categoryFilters">
      <button class="filter-btn active" data-category="all">All Fields</button>
      <button class="filter-btn" data-category="agriculture">Agriculture & Farming</button>
      <button class="filter-btn" data-category="electrical">Electrical & Solar</button>
      <button class="filter-btn" data-category="carpentry">Carpentry & Craft</button>
      <button class="filter-btn" data-category="automotive">Mechanics & Auto</button>
      <button class="filter-btn" data-category="microbusiness">Small Business</button>
    </div>
  </div>

  <!-- Interactive Project Cards Grid -->
  <div class="projects-grid" id="projectsGrid">
    <!-- Populated via JavaScript -->
  </div>

  <!-- Add New Dream Form -->
  <div class="add-dream-card">
    <h3>💡 Share Your Project Dream</h3>
    <form id="addDreamForm">
      <input type="text" id="workerName" placeholder="Your Name or Team" required />
      <select id="projectCategory" required>
        <option value="" disabled selected>Select Field of Interest</option>
        <option value="agriculture">Agriculture & Farming</option>
        <option value="electrical">Electrical & Solar</option>
        <option value="carpentry">Carpentry & Craft</option>
        <option value="automotive">Mechanics & Auto</option>
        <option value="microbusiness">Small Business</option>
      </select>
      <input type="text" id="projectTitle" placeholder="Project Title (e.g., Solar Water Pump)" required />
      <textarea id="projectDesc" rows="3" placeholder="Describe the idea, required materials, or how peers can collaborate..." required></textarea>
      <button type="submit" class="submit-btn">+ Post Your Dream</button>
    </form>
  </div>
</section>
